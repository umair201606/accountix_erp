<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Solarkon ERP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
      .hub-container{width:100%;max-width:1100px;margin:0 auto;}
      .hub-header{text-align:center;margin-bottom:24px;}
      .hub-brand{width:48px;height:48px;background:#1f2937;color:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-bottom:8px;}
      .hub-title{margin:0;font-size:20px;font-weight:700;color:#1f2937;}
      .hub-subtitle{margin:2px 0 0;color:#6b7280;font-size:13px;}
      .hub-footer{text-align:center;margin-top:24px;}
      .hub-footer a{font-size:13px;color:#9ca3af;text-decoration:none;}
      .hub-footer a:hover{text-decoration:underline;}
      @media(max-width:500px){
        .hub-brand{width:40px;height:40px;font-size:18px;}
        .hub-title{font-size:17px;}
        .hub-subtitle{font-size:12px;}
      }
    </style>
</head>
<body style="background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;">
    <div class="hub-container">
        <div class="hub-header">
            <div class="hub-brand">S</div>
            <h1 class="hub-title">Solarkon ERP</h1>
            <p class="hub-subtitle">{{ current_user.full_name }} &bull; {{ current_user.get_role_name()|title }}</p>
        </div>
        <div class="hub-grid">
            {% block content %}{% endblock %}
        </div>
        <div class="hub-footer">
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </div>
</body>
</html>
