{# The three tracking views, so moving between the feed and either side of the
   ledger never goes through the sidebar. `request.endpoint` marks the current
   one — no page needs to pass anything in. #}
<nav class="trk-tabs" aria-label="Tracking views">
  <a href="{{ url_for('inv_tracking.feed') }}"
     class="trk-tab {{ 'active' if request.endpoint in ('inv_tracking.feed', 'inv_tracking.assign_workspace') }}">
    <span>&#9878;</span><span>Payment feed</span>
  </a>
  <a href="{{ url_for('inv_tracking.sales') }}"
     class="trk-tab {{ 'active' if request.endpoint == 'inv_tracking.sales' or (doc_type is defined and doc_type == 'SI' and request.endpoint == 'inv_tracking.invoice_history') }}">
    <span>&#128178;</span><span>Sales invoices</span>
  </a>
  <a href="{{ url_for('inv_tracking.purchases') }}"
     class="trk-tab {{ 'active' if request.endpoint == 'inv_tracking.purchases' or (doc_type is defined and doc_type == 'PI' and request.endpoint == 'inv_tracking.invoice_history') }}">
    <span>&#128230;</span><span>Purchase invoices</span>
  </a>
</nav>
