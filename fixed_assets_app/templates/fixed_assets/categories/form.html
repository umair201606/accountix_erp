{% extends "fixed_assets/layouts/base.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} Category{% endblock %}
{% block page_title %}{{ 'Edit' if category else 'New' }} Category{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Category Name *</label>
        <input type="text" name="name" class="form-control" value="{{ category.name if category else '' }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ category.description if category else '' }}</textarea>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label class="form-label">Default Useful Life (years)</label>
          <input type="number" name="default_useful_life" class="form-control" value="{{ category.default_useful_life if category else '5' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Default Depreciation Method</label>
          <select name="default_depreciation_method" class="form-control">
            <option value="straight_line" {{ 'selected' if not category or category.default_depreciation_method == 'straight_line' }}>Straight Line</option>
            <option value="declining_balance" {{ 'selected' if category and category.default_depreciation_method == 'declining_balance' }}>Declining Balance</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Default Salvage Value (%)</label>
          <input type="number" step="0.01" name="default_salvage_value_pct" class="form-control" value="{{ category.default_salvage_value_pct if category else '0' }}">
        </div>
        {% if category %}
        <div class="form-group">
          <label class="form-label">Active</label>
          <select name="is_active" class="form-control">
            <option value="1" {{ 'selected' if category.is_active }}>Active</option>
            <option value="0" {{ 'selected' if not category.is_active }}>Inactive</option>
          </select>
        </div>
        {% endif %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Update' if category else 'Create' }} Category</button>
        <a href="{{ url_for('fa_categories.list_categories') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
