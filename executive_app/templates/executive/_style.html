{# Shared look for the Executive Reports pages. No page heading — the top bar
   already names the page — and no card wrappers around the lists. #}
<style>
:root{
  --exr-in:#047857; --exr-in-soft:#ecfdf5;
  --exr-out:#b45309; --exr-out-soft:#fffbeb;
  --exr-line:#e3e8ef; --exr-shadow:0 8px 20px rgba(15,23,42,.05);
}
.exr{max-width:1240px;margin:0 auto}
.exr *{box-sizing:border-box}

/* The two figures the pages lead with: how much, across how many parties. */
.exr-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 26px;margin:2px 0 14px}
.exr-total{display:flex;flex-direction:column;gap:2px}
.exr-total .lbl{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase}
.exr-total .val{color:var(--ink);font-size:27px;font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.exr-total.in .val{color:var(--exr-in)}
.exr-total.out .val{color:var(--exr-out)}
.exr-total .sub{color:var(--muted);font-size:11.5px}
.exr-asof{margin-left:auto;color:var(--muted);font-size:11.5px}

.exr-filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.exr-input,.exr-select{min-height:36px;padding:8px 11px;border:1px solid var(--exr-line);
  border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;
  outline:none;min-width:140px}
.exr-input:focus,.exr-select:focus{border-color:var(--exr-in);
  box-shadow:0 0 0 3px rgba(4,120,87,.12)}
.exr-search{flex:1 1 200px}
.exr-filterbar .btn{min-height:36px}
.exr-count{margin:0 0 12px;color:var(--muted);font-size:11.5px}

.exr-wrap{border:1px solid var(--exr-line);border-radius:11px;background:#fff;
  box-shadow:var(--exr-shadow);overflow-x:auto}
.exr-table{width:100%;border-collapse:collapse;min-width:720px}
.exr-table th{padding:10px 14px;border-bottom:1px solid var(--exr-line);
  background:linear-gradient(90deg,#f8fafc,#fff);color:var(--muted);font-size:10px;
  font-weight:800;letter-spacing:.07em;text-transform:uppercase;text-align:left;white-space:nowrap}
.exr-table td{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;color:var(--ink);
  vertical-align:middle}
.exr-table tbody tr:last-child td{border-bottom:0}
.exr-table tbody tr:hover{background:#fbfdff}
.exr-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exr-table .strong{font-weight:800}
.exr-code{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.exr-link{color:var(--exr-in);font-weight:700;text-decoration:none}
.exr-link:hover{text-decoration:underline}
.exr-group{display:inline-flex;padding:2px 8px;border-radius:999px;background:#f1f5f9;
  color:#475569;font-size:10.5px;font-weight:700;white-space:nowrap}
.exr-side{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.exr-side-receivable{background:var(--exr-in-soft);color:var(--exr-in)}
.exr-side-payable{background:var(--exr-out-soft);color:var(--exr-out)}

.exr-empty{padding:40px 16px;text-align:center;color:var(--muted)}
.exr-empty strong{display:block;margin-bottom:5px;color:var(--ink);font-size:14px}
.exr-empty p{margin:0 auto;max-width:52ch;font-size:12.5px;line-height:1.6}
.exr-empty .btn{margin-top:14px}

/* Dashboard — KPI cards and CSS-only charts (no chart library, no <canvas>). */
.exr-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:12px;margin:0 0 14px}
.exr-kpi{border:1px solid var(--exr-line);border-radius:12px;background:#fff;
  box-shadow:var(--exr-shadow);padding:13px 14px;display:flex;flex-direction:column;
  gap:3px;min-width:0}
.exr-kpi-lbl{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exr-kpi-val{color:var(--ink);font-size:25px;font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.exr-kpi-val small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.exr-kpi-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.exr-kpi.in .exr-kpi-val{color:var(--exr-in)}
.exr-kpi.out .exr-kpi-val{color:var(--exr-out)}
.exr-kpi.is-good .exr-kpi-val{color:var(--exr-in)}
.exr-kpi.is-warn .exr-kpi-val{color:#b91c1c}

.exr-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:14px}
.exr-chart{border:1px solid var(--exr-line);border-radius:12px;background:#fff;
  box-shadow:var(--exr-shadow);padding:14px;min-width:0}
.exr-chart-title{margin:0 0 12px;font-size:12px;font-weight:800;color:var(--ink);
  letter-spacing:.01em}
.exr-bar-group{margin-bottom:12px}
.exr-bar-group:last-of-type{margin-bottom:0}
.exr-bar-label{display:block;color:var(--muted);font-size:10px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.exr-bar-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.exr-bar-row:last-child{margin-bottom:0}
.exr-bar-track{flex:1;height:9px;border-radius:999px;background:#eef2f7;
  overflow:hidden;min-width:0}
.exr-bar-fill{display:block;height:100%;border-radius:999px}
.exr-bar-track.in .exr-bar-fill{background:var(--exr-in)}
.exr-bar-track.out .exr-bar-fill{background:var(--exr-out)}
.exr-bar-amt{flex:none;min-width:76px;text-align:right;font-size:11px;font-weight:800;
  color:var(--ink);font-variant-numeric:tabular-nums}
.exr-chart-legend{display:flex;align-items:center;gap:6px;margin-top:12px;
  color:var(--muted);font-size:11px}
.exr-chart-legend .exr-legend-key{width:9px;height:9px;border-radius:3px;flex:none}
.exr-chart-legend .exr-legend-key.in{background:var(--exr-in)}
.exr-chart-legend .exr-legend-key.out{background:var(--exr-out);margin-left:10px}

.exr-top-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.exr-top-col h4{margin:0 0 6px;color:var(--muted);font-size:10px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase}
.exr-top-row{display:flex;align-items:center;gap:9px;padding:7px 0;
  border-bottom:1px solid #f1f5f9;text-decoration:none;min-width:0}
.exr-top-row:last-child{border-bottom:0}
.exr-top-name{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exr-top-track{flex:none;width:34%;height:8px;border-radius:999px;background:#eef2f7;
  overflow:hidden}
.exr-top-fill{display:block;height:100%;border-radius:999px}
.exr-top-fill.in{background:var(--exr-in)}
.exr-top-fill.out{background:var(--exr-out)}
.exr-top-amt{flex:none;font-size:11px;font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.exr-top-amt em{font-style:normal;color:var(--muted);font-weight:700;margin-left:4px}

/* Settings picker — browse the chart on the left, live scope on the right. */
.exr-picker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;align-items:start}
.exr-pane{border:1px solid var(--exr-line);border-radius:12px;background:#fff;
  box-shadow:var(--exr-shadow);overflow:hidden;display:flex;flex-direction:column;
  min-width:0}
.exr-pane-head{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--exr-line);background:linear-gradient(90deg,#f8fafc,#fff)}
.exr-pane-title{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.exr-pane-sub{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.exr-pane-scroll{overflow:auto;max-height:64vh;border-top:1px solid #f1f5f9}
.exr-pane-scroll .exr-search-wrap{position:sticky;top:0;z-index:6;background:#fff;
  padding:10px 14px 9px;border-bottom:1px solid #f1f5f9}
.exr-search-wrap{position:relative}
.exr-search-wrap svg{position:absolute;left:25px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:#94a3b8;pointer-events:none;z-index:1}
.exr-search{width:100%;min-height:38px;padding:8px 11px 8px 34px;border:1px solid var(--exr-line);
  border-radius:9px;background:#fff;color:var(--ink);font-family:inherit;font-size:12.5px;
  outline:none;-webkit-appearance:none;appearance:none}
.exr-search:focus{border-color:var(--exr-in);box-shadow:0 0 0 3px rgba(4,120,87,.12)}
.exr-search::-webkit-search-cancel-button{opacity:.5;cursor:pointer}

.exr-tree{background:#fff}
.exr-section-head{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;
  background:linear-gradient(90deg,#f8fafc,#fff);border-bottom:1px solid var(--exr-line);
  border-top:1px solid var(--exr-line);font-family:inherit;font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  text-align:left}
.exr-section:first-child .exr-section-head{border-top:0}
.exr-section-head:hover{background:#fbfdff}
.exr-section-head svg{width:13px;height:13px;margin-left:auto;flex:none;color:#94a3b8;
  transition:transform .15s}
.exr-section-head[aria-expanded="false"] svg{transform:rotate(-90deg)}
.exr-section-count{font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.exr-section.is-close .exr-node{display:none}
.exr-node{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;
  align-items:center;padding:8px 14px;padding-left:calc(14px + var(--lvl,0)*14px);
  border-bottom:1px solid #f1f5f9;min-width:0}
.exr-node:last-child{border-bottom:0}
.exr-node:hover{background:#fbfdff}
.exr-node.is-on{background:var(--exr-in-soft);box-shadow:inset 3px 0 0 var(--exr-in)}
.exr-node.exr-is-hidden{display:none}
.exr-node.exr-ghost{opacity:.5}
.exr-caret{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;
  justify-content:center;border:0;background:none;border-radius:6px;cursor:pointer;
  color:#94a3b8;font-size:9px;padding:0;transition:transform .15s}
.exr-caret[aria-expanded="false"]{transform:rotate(-90deg)}
.exr-caret:hover{background:#eef2f7;color:#475569}
.exr-caret.is-void{cursor:default}
.exr-caret.is-void:hover{background:none}
.exr-caret:focus-visible{outline:2px solid var(--exr-in);outline-offset:1px}
.exr-node-check{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.exr-node-check input{position:absolute;opacity:0;width:0;height:0}
.exr-checkbox{width:18px;height:18px;flex:none;border:1.5px solid #cbd5e1;
  border-radius:5px;background:#fff;display:inline-flex;align-items:center;
  justify-content:center;transition:background .15s,border-color .15s}
.exr-node-check input:checked + .exr-checkbox{background:var(--exr-in);border-color:var(--exr-in)}
.exr-node-check input:checked + .exr-checkbox::after{content:"\2713";color:#fff;
  font-size:11px;font-weight:800;line-height:1}
.exr-node-check input:focus-visible + .exr-checkbox{outline:2px solid var(--exr-in);
  outline-offset:2px}
.exr-node-name{font-size:13px;color:var(--ink);font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exr-node-sub{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;
  white-space:nowrap;justify-self:end}
.exr-deep{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);
  font-size:11.5px;white-space:nowrap;justify-self:end}
.exr-deep.is-off{display:none}
.exr-deep input{position:absolute;opacity:0;width:0;height:0}
.exr-switch{width:30px;height:17px;flex:none;border-radius:999px;background:#cbd5e1;
  position:relative;transition:background .15s}
.exr-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;
  height:13px;border-radius:50%;background:#fff;transition:left .15s;
  box-shadow:0 1px 2px rgba(15,23,42,.25)}
.exr-deep input:checked + .exr-switch{background:var(--exr-in)}
.exr-deep input:checked + .exr-switch::after{left:15px}
.exr-deep input:focus-visible + .exr-switch{outline:2px solid var(--exr-in);
  outline-offset:2px}
.exr-deep-label{color:var(--muted)}
.exr-deep input:checked ~ .exr-deep-label{color:var(--exr-in);font-weight:700}
.exr-node input:disabled ~ *{opacity:.55}
.exr-node input:disabled{cursor:not-allowed}

/* Right pane — what the reports actually read. */
.exr-pick{background:#fff}
.exr-pick-type{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;
  border-bottom:1px solid var(--exr-line);font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.exr-pick-type-n{display:inline-flex;min-width:18px;height:18px;align-items:center;
  justify-content:center;border-radius:999px;background:#eef2f7;color:#64748b;
  font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.exr-pick-row{display:flex;align-items:center;gap:10px;padding:9px 14px;
  border-bottom:1px solid #f1f5f9;min-width:0}
.exr-pick-row:last-child{border-bottom:0}
.exr-pick-row:hover{background:#fbfdff}
.exr-pick-name{font-size:13px;font-weight:600;color:var(--ink);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exr-pick-code{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.exr-pick-via{margin-left:auto;flex:none;color:var(--muted);font-size:10.5px;
  white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.exr-pick-empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:12.5px;
  line-height:1.6}
.exr-pick-empty strong{display:block;color:var(--ink);font-size:13.5px;margin-bottom:4px}
.exr-savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.exr-save-note{color:var(--muted);font-size:12px;line-height:1.5}
.exr-savebar .btn{min-height:40px;padding-left:24px;padding-right:24px;margin-left:auto}
.exr.is-ro .exr-pane{opacity:.8}
.exr.is-ro .exr-pick{opacity:.7}

@media(max-width:720px){
  .exr-head{gap:10px 18px}
  .exr-total .val{font-size:22px}
  .exr-asof{margin-left:0;width:100%}
  .exr-filterbar .exr-input,.exr-filterbar .exr-select{flex:1 1 140px;min-width:0;min-height:40px}
  .exr-filterbar .btn{min-height:40px}
  /* Table becomes cards: each cell shows its own label. */
  .exr-table{min-width:0}
  .exr-table thead{display:none}
  .exr-table,.exr-table tbody,.exr-table tr,.exr-table td{display:block;width:100%}
  .exr-table tbody tr{padding:12px 14px;border-bottom:1px solid #eef2f7}
  .exr-table td{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:4px 0;border:0;text-align:right}
  .exr-table td::before{content:attr(data-label);color:var(--muted);font-size:10px;
    font-weight:800;letter-spacing:.07em;text-align:left;text-transform:uppercase;flex:none}
  /* Picker stacks; tree rows get the sub-accounts switch on its own line. */
  .exr-picker{grid-template-columns:1fr;gap:12px}
  .exr-pane-scroll{max-height:none}
  .exr-node{grid-template-columns:auto minmax(0,1fr) auto;row-gap:5px;
    padding-top:10px;padding-bottom:10px}
  .exr-node-sub{grid-column:2;grid-row:1;align-self:center}
  .exr-deep{grid-column:1/-1;justify-self:start;padding-left:30px;min-height:36px}
  .exr-node-check{min-height:36px}
  .exr-pick-via{max-width:42%}
  .exr-savebar .btn{margin-left:0;flex:1 1 100%}
  .exr-save-note{flex:1 1 100%}
  .exr-top-cols{grid-template-columns:1fr;gap:6px}
}
@media(max-width:480px){
  .exr-kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .exr-kpi-val{font-size:21px}
  .exr-bar-amt{min-width:64px}
}
</style>
