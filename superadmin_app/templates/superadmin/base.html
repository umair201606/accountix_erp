<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Super Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    body { margin: 0; background: #f1f5f9; color: #1e293b;
           font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .sa-top { background: #1d4ed8; color: #fff; display: flex; align-items: center;
              gap: 18px; padding: 10px 20px; flex-wrap: wrap; }
    .sa-brand { color: #fff; text-decoration: none; font-weight: 800; font-size: 16px; letter-spacing: .3px; }
    .sa-nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .sa-nav a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 13px;
                font-weight: 600; padding: 7px 12px; border-radius: 6px; }
    .sa-nav a:hover { background: rgba(255,255,255,.12); }
    .sa-nav a.active { background: #fff; color: #1d4ed8; }
    .sa-user { margin-left: auto; display: flex; align-items: center; gap: 12px;
               font-size: 12.5px; flex-wrap: wrap; }
    .sa-user a { color: rgba(255,255,255,.9); text-decoration: none; font-size: 12px;
                 font-weight: 600; padding: 6px 10px; border: 1px solid rgba(255,255,255,.35);
                 border-radius: 6px; }
    .sa-user a:hover { background: rgba(255,255,255,.12); }
    .sa-main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
    .sa-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
               padding: 20px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .sa-card h3 { margin: 0 0 4px; font-size: 16px; }
    .sa-card .hint { color: #64748b; font-size: 12.5px; margin: 0 0 16px; }
    .sa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 14px; margin-bottom: 20px; }
    .sa-stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
               padding: 18px 20px; text-align: center; }
    .sa-stat .v { font-size: 28px; font-weight: 800; color: #1d4ed8; }
    .sa-stat .l { font-size: 12px; color: #64748b; margin-top: 4px; }
    .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .fgroup { min-width: 0; }
    .fgroup label.lbl { display: block; font-size: 10.5px; font-weight: 700; color: #64748b;
                        text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
    .inp, .sel { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
                 font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px;
                 background: #fff; outline: none; }
    .inp:focus, .sel:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.12); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
           border: 1px solid #1d4ed8; border-radius: 6px; font-size: 13px; font-weight: 600;
           cursor: pointer; text-decoration: none; background: #fff; color: #1d4ed8; }
    .btn:hover { background: #eff6ff; }
    .btn-p { background: #1d4ed8; color: #fff; }
    .btn-p:hover { background: #1e40af; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .sa-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .sa-note { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px;
               padding: 10px 12px; font-size: 12px; color: #1e40af; margin-top: 14px;
               line-height: 1.5; }
    table.sa-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.sa-tbl th { text-align: left; font-size: 10.5px; text-transform: uppercase;
                      letter-spacing: .4px; color: #64748b; padding: 8px 10px;
                      border-bottom: 2px solid #e2e8f0; }
    table.sa-tbl td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    table.sa-tbl tr:hover td { background: #f8fafc; }
    .tbl-scroll { overflow-x: auto; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
            font-size: 11px; font-weight: 700; }
    .pill-on { background: #dcfce7; color: #166534; }
    .pill-off { background: #f1f5f9; color: #64748b; }
    .pill-sa { background: #dbeafe; color: #1d4ed8; }
    .sa-stog { position: relative; display: inline-block; width: 40px; height: 22px;
               vertical-align: middle; }
    .sa-stog input { opacity: 0; width: 0; height: 0; }
    .sa-stog .sl { position: absolute; inset: 0; background: #cbd5e1; border-radius: 11px;
                   cursor: pointer; transition: .18s; }
    .sa-stog .sl:before { content: ''; position: absolute; height: 18px; width: 18px;
                          left: 2px; bottom: 2px; background: #fff; border-radius: 50%;
                          transition: .18s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .sa-stog input:checked + .sl { background: #16a34a; }
    .sa-stog input:checked + .sl:before { transform: translateX(18px); }
    @media (max-width: 640px) {
      .fgrid { grid-template-columns: 1fr; }
      .sa-user { margin-left: 0; width: 100%; justify-content: space-between; }
      .sa-top { gap: 10px; }
      .sa-main { padding: 16px 12px 40px; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="sa-top">
    <a class="sa-brand" href="{{ url_for('superadmin.index') }}">Super Admin Portal</a>
    <nav class="sa-nav">
      <a href="{{ url_for('superadmin.index') }}" class="{{ 'active' if request.endpoint == 'superadmin.index' }}">Dashboard</a>
      <a href="{{ url_for('superadmin.companies') }}" class="{{ 'active' if request.endpoint in ['superadmin.companies', 'superadmin.company_edit'] }}">Companies</a>
      <a href="{{ url_for('superadmin.users') }}" class="{{ 'active' if request.endpoint == 'superadmin.users' }}">Users</a>
    </nav>
    <div class="sa-user">
      <span>{{ current_user.full_name }}</span>
      <a href="{{ url_for('dashboard.hub') }}">ERP Hub</a>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
  </header>
  <main class="sa-main">
    {% include '_flash.html' %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
