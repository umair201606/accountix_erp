<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin Console — Accountix ERP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d4ed8'/><text x='16' y='22' font-size='18' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>A</text></svg>">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #002045;
    --primary-container: #1a365d;
    --on-primary: #ffffff;
    --bg: #f6f9ff;
    --surface: #ffffff;
    --surface-low: #eef4fc;
    --surface-variant: #dde3eb;
    --on-surface: #161c22;
    --on-surface-variant: #43474e;
    --outline: #74777f;
    --outline-variant: #c4c6cf;
    --error: #ba1a1a;
    --error-container: #ffdad6;
    --accent: #1d4ed8;
    --shadow: 0 8px 30px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(145deg, #002045 0%, #0a2e5c 50%, #001a36 100%);
    color: var(--on-surface);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .shell { width: 100%; max-width: 420px; }

  /* ── Brand ──────────────────────────────────────────────── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--on-primary);
    box-shadow: 0 4px 12px rgba(29,78,216,.4);
  }
  .brand-name {
    color: var(--on-primary);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.02em;
  }

  /* ── Card ────────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head { padding: 28px 32px 0; }
  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 9999px;
    background: var(--accent);
    color: var(--on-primary);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .card-title {
    margin-top: 14px;
    font-size: 22px;
    line-height: 1.3;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -.02em;
  }
  .card-desc {
    margin-top: 8px;
    color: var(--on-surface-variant);
    font-size: 13.5px;
    line-height: 1.5;
  }

  /* ── Flash ───────────────────────────────────────────────── */
  .flash {
    margin: 0 32px 4px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--error-container);
    color: var(--error);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .flash::before {
    content: '\26A0';
    font-size: 14px;
    flex-shrink: 0;
  }

  /* ── Form ────────────────────────────────────────────────── */
  form { padding: 24px 32px 32px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    margin-bottom: 7px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--on-surface-variant);
  }
  .field input {
    width: 100%;
    padding: 11px 14px;
    font: inherit;
    font-size: 14px;
    border: 1.5px solid var(--outline-variant);
    border-radius: 10px;
    background: var(--surface);
    color: var(--on-surface);
    outline: none;
    transition: all .15s ease;
  }
  .field input::placeholder { color: var(--outline); }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(29,78,216,.1);
  }

  .submit-btn {
    width: 100%;
    padding: 12px 20px;
    border: 0;
    border-radius: 10px;
    background: var(--primary);
    color: var(--on-primary);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
    margin-top: 4px;
  }
  .submit-btn:hover {
    background: var(--primary-container);
    box-shadow: 0 4px 12px rgba(0,32,69,.3);
  }
  .submit-btn:active { transform: scale(.98); }

  /* ── Footer ──────────────────────────────────────────────── */
  .foot {
    padding: 16px 32px;
    background: var(--surface-low);
    border-top: 1px solid var(--outline-variant);
    font-size: 13px;
    color: var(--on-surface-variant);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .foot a {
    font-weight: 600;
    color: var(--primary);
    transition: color .15s;
  }
  .foot a:hover { color: var(--accent); }

  /* ── Responsive ──────────────────────────────────────────── */
  @media (max-width: 440px) {
    body { padding: 16px; }
    .card-head, form, .foot { padding-left: 20px; padding-right: 20px; }
    .flash { margin-left: 20px; margin-right: 20px; }
    .brand-name { font-size: 16px; }
    .card-title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="brand">
    <span class="brand-mark">A</span>
    <span class="brand-name">Accountix ERP</span>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-tag">Platform access</span>
      <h1 class="card-title">Super admin console</h1>
      <p class="card-desc">Manage companies, users and global limits across the whole platform.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for _cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label for="login">User ID</label>
        <input type="text" id="login" name="login" required autofocus autocomplete="username"
               autocomplete="username" placeholder="Your user ID (or email)">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
               autocomplete="current-password" placeholder="Enter password">
      </div>
      <button type="submit" class="submit-btn">Enter console</button>
    </form>

    <div class="foot">
      <a href="{{ url_for('auth.login') }}">&larr; Staff sign in</a>
      <a href="{{ url_for('signup') }}">Request access</a>
      <a href="{{ url_for('landing') }}">Home</a>
    </div>
  </div>
</div>

</body>
</html>
