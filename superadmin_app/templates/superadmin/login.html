<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin Console — Accountix ERP</title>
<meta name="robots" content="noindex">
<style>
  /* Deliberately darker than the tenant sign-in: this door leads to every
     company on the platform, and it should not look like the one staff use. */
  :root {
    --primary: #002045;
    --primary-container: #1a365d;
    --on-primary: #ffffff;
    --bg: #f6f9ff;
    --surface: #ffffff;
    --surface-low: #eef4fc;
    --surface-variant: #dde3eb;
    --on-surface: #161c22;
    --on-surface-variant: #43474e;
    --outline: #74777f;
    --outline-variant: #c4c6cf;
    --error: #ba1a1a;
    --error-container: #ffdad6;
    --shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--primary); color: var(--on-surface);
    font-size: 14px; line-height: 20px; min-height: 100vh;
    display: grid; place-items: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .shell { width: 100%; max-width: 400px; }

  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); color: var(--primary); display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .brand span.name { color: var(--on-primary); font-size: 16px; font-weight: 700; letter-spacing: -.01em; }

  .card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .card-head { padding: 24px 28px 0; }
  .card-head .tag {
    display: inline-block; padding: 4px 10px; border-radius: 9999px;
    background: var(--surface-variant); color: var(--on-surface-variant);
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  }
  .card-head h1 { margin-top: 12px; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--primary); }
  .card-head p { margin-top: 6px; color: var(--on-surface-variant); }

  form { padding: 20px 28px 28px; }
  .field { margin-bottom: 16px; }
  label {
    display: block; margin-bottom: 6px;
    font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--on-surface-variant);
  }
  input {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    border: 1px solid var(--outline-variant); border-radius: 8px;
    background: var(--surface); color: var(--on-surface); outline: none;
    transition: border-color .15s;
  }
  input::placeholder { color: var(--outline); }
  input:focus { border-color: var(--primary); }

  button {
    width: 100%; padding: 11px 20px; border: 0; border-radius: 8px;
    background: var(--primary); color: var(--on-primary);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-container); }

  .flash {
    margin: 0 28px 4px; padding: 10px 12px; border-radius: 8px;
    background: var(--error-container); color: var(--error); font-size: 13px;
  }

  .foot {
    padding: 14px 28px; background: var(--surface-low);
    border-top: 1px solid var(--outline-variant);
    font-size: 13px; color: var(--on-surface-variant);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .foot a { font-weight: 600; color: var(--primary); }
  .foot a:hover { text-decoration: underline; }

  @media (max-width: 400px) {
    body { padding: 16px; }
    .card-head, form, .foot { padding-left: 18px; padding-right: 18px; }
    .flash { margin-left: 18px; margin-right: 18px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="brand">
    <span class="mark">A</span>
    <span class="name">Accountix ERP</span>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="tag">Platform access</span>
      <h1>Super admin console</h1>
      <p>Manage companies, users and global limits across the whole platform.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for _cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label for="login">User ID</label>
        <input type="text" id="login" name="login" required autofocus
               autocomplete="username" placeholder="Your user ID (or email)">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="Enter password">
      </div>
      <button type="submit">Enter console</button>
    </form>

    <div class="foot">
      <a href="{{ url_for('auth.login') }}">&larr; Staff sign in</a>
      <a href="{{ url_for('landing') }}">Home</a>
    </div>
  </div>
</div>

</body>
</html>
